name: Build and Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating releases and uploading assets

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for generating changelog

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Cache Gradle & NDK build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set unique build version
        id: version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/set-build-version.js

      - name: Align Expo native dependency versions
        run: npx expo install --fix

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Give Gradle more heap for the Skia/NDK build
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Get current date
        id: info
        run: echo "date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }} (${{ steps.info.outputs.date }})
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: ahabit-apk-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk
